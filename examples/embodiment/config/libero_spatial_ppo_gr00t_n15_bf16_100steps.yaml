defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "logs/20260923-gr00t-n15-spatial-ppo-bf16/train"
    project_name: rlinf-ppo-csd
    experiment_name: "spatial_ppo_gr00t_n15_bf16_100steps"
    logger_backends: ["tensorboard", "wandb"]
    wandb_entity: riasok

  max_epochs: 1000
  max_steps: 100

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "checkpoints/RLinf-Gr00t-SFT-Spatial"
    precision: "bf16"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128    # upstream value, sized for bf16
  global_batch_size: 1024
  seed: 1234
  enable_offload: False

  model:
    model_path: "checkpoints/RLinf-Gr00t-SFT-Spatial"
    model_type: "gr00t"
    add_value_head: True
    precision: "bf16"   # stock: bf16 throughout (fp32-master requirement dropped by request)

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    mixed_precision:
      param_dtype: "bf16"
      reduce_dtype: "bf16"
      buffer_dtype: "bf16"

reward:
  use_reward_model: False

critic:
  use_critic_model: False

sync_precision: "bf16"
