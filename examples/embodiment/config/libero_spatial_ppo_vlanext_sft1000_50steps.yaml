# Copy of libero_spatial_ppo_vlanext_20261107.yaml (Elice-holi2) with ONLY these changes:
#   start ckpt SFT step 1000 (was checkpoint_final), GPUs 4-5 on Elice-holi1 (was 4-7 on Elice-holi2),
#   max_steps 50 (was 100), log_path/experiment_name, vlanext repo/lmm paths -> relocated copy under /cache.
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/vlanext@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-5

runner:
  task_type: embodied
  logger:
    log_path: "/cache/minjaeoh/vlanext_rl_20261110/runs/ppo_sft1000_50steps/train"
    project_name: rlinf-vlanext
    experiment_name: "vlanext_ppo_libero_spatial_frozenvlm_sft1000_ns5_seed42"
    wandb_entity: riasok
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 1000
  max_steps: 50

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/cache/minjaeoh/vlanext_rl_20261110/ckpts/checkpoint_1000.pt"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 42
  enable_offload: False

  model:
    model_path: "/cache/minjaeoh/vlanext_rl_20261110/ckpts/checkpoint_1000.pt"
    model_type: "vlanext"
    num_action_chunks: 4
    num_steps: 5
    add_value_head: True
    vlanext:
      repo_path: "/cache/minjaeoh/vlanext_rl_20261110/RLinf/third_party/VLANeXt"
      lmm_path: "/cache/minjaeoh/vlanext_rl_20261110/RLinf/checkpoints/Qwen3-VL-2B-Instruct"

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
