# Joint 130-task adaptation of the pi_RL Long Flow-SDE recipe, not an exact
# reproduction of the undocumented HF PPO-130 release. See PIRL_130_20260906.md.
defaults:
  - env/libero_130@env.train
  - env/libero_130@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-7

runner:
  task_type: embodied
  only_eval: false
  resume_dir: null
  ckpt_path: null
  logger:
    log_path: /data/minjaeoh/RLinf/logs/20260906-pirl130/train
    project_name: rlinf-ppo-csd
    experiment_name: pi05_ppo_libero130_longrecipe_seed42_20260906
    logger_backends: [tensorboard, wandb]
  max_epochs: 500
  max_steps: 500
  save_interval: 40
  val_check_interval: 10
  overlap_env_bootstrap: false

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  csd_enabled: false
  csd_diagnostic_only: false
  csd_beta: 0.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    task_suite_name: libero_130
    task_id_filter: null
    use_ordered_reset_state_ids: false
    video_cfg:
      save_video: false
  eval:
    auto_reset: true
    ignore_terminations: true
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    task_suite_name: libero_130
    task_id_filter: null
    num_trials_per_task: 1
    total_num_envs: 16
    rollout_epoch: 9
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_130
  pipeline_stage_num: 1
  enable_offload: true
  model:
    model_path: /data/minjaeoh/RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  micro_batch_size: 16
  model:
    model_type: openpi
    add_value_head: true
    model_path: /data/minjaeoh/RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT
    num_action_chunks: 10
    num_steps: 5
    openpi:
      value_after_vlm: true
      action_horizon: 10
      train_expert_only: true
      noise_method: flow_sde
      noise_level: 0.5
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    min_lr_rate: 0.1
    lr_scheduler: cosine
    total_training_steps: 500
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
